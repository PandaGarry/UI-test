<ignore>
	<link rel="stylesheet" type="text/css" href="../../../../resources/themes/pastel.css">
</ignore>

<div id="MainMenuContainer" class="layout-window menu-screen">
	<header class="menu-topbar">
		<button type="button" class="menu-burger" id="menuBurger" aria-label="Menu" aria-controls="menuDrawer" aria-expanded="false">
			<span></span><span></span><span></span>
		</button>
		<div class="menu-brand">
			<span class="theme-logo menu-brand-mark" aria-hidden="true"></span>
			<span class="menu-brand-name">WARFRONT</span>
		</div>
		<div class="menu-lang" role="group" aria-label="Language">
			<button type="button" id="langRus" class="menu-lang-option">RU</button>
			<button type="button" id="langEng" class="menu-lang-option">EN</button>
		</div>
	</header>

	<aside class="menu-news" id="newsBanner" role="region" aria-label="News">
		<span class="menu-news-tag" id="newsTag">NEW</span>
		<div class="menu-news-body">
			<p class="menu-news-title" id="newsTitle"></p>
			<p class="menu-news-text" id="newsText"></p>
		</div>
		<button type="button" class="menu-news-close" id="newsClose" aria-label="Close">×</button>
	</aside>

	<main class="menu-main">
		<section class="menu-player" aria-label="Player">
			<span class="menu-avatar" id="menuAvatar" aria-hidden="true">?</span>
			<label class="menu-field" for="playerNameInput">
				<span class="menu-field-label" id="menuNameLabel">Player</span>
				<input class="menu-field-input" id="playerNameInput" placeholder="Player Name" value="UnknownPlayer" autocomplete="off" maxlength="32">
			</label>
		</section>
		<span class="form-label form-label-danger menu-field-error" style="display: none;" id="playerNameInputValidation"></span>

		<!-- Lobby already running (demo: bots only, joining is not available yet). -->
		<section class="menu-live" aria-label="Lobby">
			<header class="menu-live-head">
				<span class="menu-live-title" id="liveTitle">Lobby</span>
				<span class="menu-live-status">
					<span class="menu-live-dot" aria-hidden="true"></span>
					<span id="liveStatus">in progress</span>
					<span class="menu-live-timer" id="liveTimer">00:00:00</span>
				</span>
			</header>
			<div class="menu-live-body">
				<div class="menu-live-map" aria-hidden="true"></div>
				<div class="menu-live-info">
					<p class="menu-live-name" id="liveMap">World</p>
					<p class="menu-live-count"><span id="liveCount">10/10</span> <span id="livePlayers">players</span></p>
					<ul class="menu-live-bots" id="liveBots"></ul>
				</div>
			</div>
		</section>

		<section class="menu-actions" aria-label="Lobby">
			<!-- button class="btn btn-primary btn-featured btn-block" id="btnStartMultiplayer">Multiplayer</button -->
			<button type="button" class="menu-btn menu-btn-primary" id="btnStartSingleplayer">Create lobby</button>
			<button type="button" class="menu-btn menu-btn-locked" id="btnJoinLobby" disabled aria-disabled="true" title="Coming soon: multiplayer">
				<span id="btnJoinLobbyText">Join lobby</span>
				<span class="menu-lock" id="btnJoinLobbyLock" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
				</span>
			</button>
		</section>
	</main>

	<nav class="menu-drawer-backdrop" id="menuDrawerBackdrop" aria-hidden="true"></nav>
	<nav class="menu-drawer" id="menuDrawer" aria-label="Main menu" aria-hidden="true">
		<div class="menu-drawer-head">
			<span class="menu-brand-name">WARFRONT</span>
			<button type="button" class="menu-drawer-close" id="menuDrawerClose" aria-label="Close menu">×</button>
		</div>
		<ul class="menu-drawer-list">
			<li><button type="button" class="menu-drawer-item is-active" id="drawerPlay">Home</button></li>
			<li><button type="button" class="menu-drawer-item" id="drawerCreate">Create lobby</button></li>
			<li><button type="button" class="menu-drawer-item is-locked" id="drawerLobbies" disabled><span id="drawerLobbiesText">Lobbies</span> <span class="menu-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span></button></li>
			<li><button type="button" class="menu-drawer-item is-locked" id="drawerSettings" disabled><span id="drawerSettingsText">Settings</span> <span class="menu-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span></button></li>
			<li><button type="button" class="menu-drawer-item" id="drawerImprint">Site Notice</button></li>
			<li><button type="button" class="menu-drawer-item" id="drawerPrivacy">Privacy</button></li>
		</ul>
	</nav>
<!-- Footer: info line reserved for live stats (filled later, hidden until then), link row below. -->
<footer class="menu-footer ui-passive">
	<p class="menu-footer-info" id="menuFooterInfo" hidden></p>
	<nav class="menu-footer-links" aria-label="Links">
		<a id="linkCommunity" href="https://discord.gg/Zv8p8tXaDA" target="_blank" rel="noopener">Community</a>
		<a id="linkSource" href="https://github.com/WarFrontIO" target="_blank" rel="noopener">Source</a>
		<a id="linkImprint" href="javascript:void(0);" class="ui-clickable">Site Notice</a>
		<a id="linkPrivacy" href="javascript:void(0);">Privacy</a>
	</nav>
</footer>
</div>
