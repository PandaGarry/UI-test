<ignore>
	<link rel="stylesheet" type="text/css" href="../../../../resources/themes/pastel.css">
</ignore>

<div id="GameHudContainer" class="layout-window background-vignette hud">
	<!-- Top bar: no boxes, like the reference. Left: rankings. Right: clock, pause, settings, exit. -->
	<div class="hud-topbar">
		<div id="hudLeaderboard" class="hud-leaderboard">
			<button id="hudLeaderboardToggle" class="hud-top-btn" aria-expanded="false" title="Рейтинг" aria-label="Рейтинг"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20h16M7 20v-7M12 20V5M17 20v-10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
			<div id="leaderboard" class="hud-leaderboard-list"></div>
		</div>
		<span id="gameClock" class="hud-clock">00:00:00</span>
		<div class="hud-top-right">
			<button id="hudPause" class="hud-top-btn" title="Пауза" aria-label="Пауза" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
			<button id="openSettings" class="hud-top-btn" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
			<button id="hudExit" class="hud-top-btn" title="Выйти в меню" aria-label="Выйти в меню"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M10 5H5v14h5M10 12h9M15.5 8.5L19 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
		</div>
	</div>

	<!-- Player line under the top bar: name and share of the map. -->
	<div id="hudPlayerBlock" class="hud-player" hidden>
		<span id="hudPlayerSwatch" class="hud-player-swatch"></span>
		<span id="hudPlayerName" class="hud-player-name">—</span>
	</div>

	<div id="selectorContainer" class="hud-dock">
		<div id="hudAttackList" class="hud-attack-list" hidden></div>
		<div class="hud-action-row">
			<button id="hudBtnChat" class="hud-action is-soon" title="Чат" aria-label="Чат"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
			<button id="hudBtnAttacks" class="hud-action" title="Атаки" aria-label="Атаки" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 19L17 5M5 5l12 14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M3 15l3 3M18 6l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
			<button class="hud-action is-soon" title="Ядерное оружие" aria-label="Ядерное оружие"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 12L8.5 5.9A7 7 0 0 1 15.5 5.9Z" fill="#e0463f" transform="rotate(0 12 12)"/><path d="M12 12L19 12A7 7 0 0 1 15.5 18.1Z" fill="#e0463f"/><path d="M12 12L8.5 18.1A7 7 0 0 1 5 12Z" fill="#e0463f"/><circle cx="12" cy="12" r="2.2" fill="#e0463f"/></svg></button>
			<button class="hud-action is-soon" title="Союз" aria-label="Союз"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="9" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
			<button class="hud-action is-soon" title="Золото" aria-label="Золото"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 14l3-6h10l3 6z" fill="#f5c944"/><path d="M4 14h16v4H4z" fill="#d9a92b"/></svg></button>
			<span class="hud-action-label">Чат</span>
		</div>
		<div class="hud-dock-row">
			<div class="hud-gold-pill" title="Золото (появится в этапе экономики)">
				<span class="hud-coin"></span><span id="hudGold">—</span>
			</div>
			<div class="hud-troop-pill" title="Слева — войска в резерве, справа — лимит войск (растёт с территорией и домами)">
				<span id="hudTroopFill" class="hud-troop-fill"></span>
				<span id="hudSendCount" class="hud-troops-send">0</span>
				<span id="hudTroopRate" class="hud-rate" title="Прирост войск в секунду">+0/s</span>
				<span id="selectorTroopCount" class="hud-troops">0</span>
			</div>
			<div class="hud-attack-block">
				<div class="hud-attack-head"><span class="hud-attack-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 4L12 12M8.5 8.5L15.5 15.5M12 12L4 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></span><span id="sliderAttackNumber" class="hud-attack-percent">50.0%</span></div>
				<label id="sliderAttackStrength" class="hud-slider" title="Доля армии, которую вы отправляете">
					<input id="sliderAttackHidden" type="range" min="0" max="100" step="5">
				</label>
			</div>
		</div>
	</div>
</div>
