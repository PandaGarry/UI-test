<ignore>
	<link rel="stylesheet" type="text/css" href="../../../../resources/themes/pastel.css">
</ignore>

<div id="GameHudContainer" class="layout-window background-vignette hud">
	<div id="hudLeaderboard" class="hud-leaderboard">
		<button id="hudLeaderboardToggle" class="hud-leaderboard-summary" aria-expanded="false">
			<span id="hudRank" class="hud-leaderboard-rank">–</span>
			<span id="hudShare" class="hud-leaderboard-share">0.0%</span>
		</button>
		<div id="leaderboard" class="hud-leaderboard-list"></div>
	</div>

	<div class="hud-top-right">
		<span id="gameClock" class="hud-clock">00:00:00</span>
		<button id="openSettings" class="btn btn-circle btn-primary icon-m icon-settings"></button>
	</div>

	<div id="selectorContainer" class="hud-attack">
		<div class="hud-attack-stats">
			<span id="selectorDensityNumber" class="hud-stat">0.00</span>
			<span id="selectorTroopCount" class="hud-stat hud-stat-main">0</span>
		</div>
		<div class="hud-attack-row">
			<button id="attackStepDown" class="btn hud-step"></button>
			<label id="sliderAttackStrength" class="hud-slider">
				<span id="sliderAttackNumber" class="hud-slider-value">50.0%</span>
				<input id="sliderAttackHidden" type="range" min="0" max="100" step="5">
			</label>
			<button id="attackStepUp" class="btn hud-step"></button>
		</div>
	</div>
</div>
