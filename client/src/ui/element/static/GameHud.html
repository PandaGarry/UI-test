<ignore>
	<link rel="stylesheet" type="text/css" href="../../../../resources/themes/pastel.css">
</ignore>

<div id="GameHudContainer" class="layout-window background-vignette hud">
	<div id="hudLeaderboard" class="hud-leaderboard">
		<button id="hudLeaderboardToggle" class="hud-leaderboard-summary" aria-expanded="false">
			<span id="hudRank" class="hud-leaderboard-rank">–</span>
			<span id="hudShare" class="hud-leaderboard-share">0.0%</span>
		</button>
		<div id="leaderboard" class="hud-leaderboard-list"></div>
	</div>

	<div class="hud-top-right">
		<span id="gameClock" class="hud-clock">00:00:00</span>
		<button id="hudPause" class="btn btn-circle btn-primary" title="Пауза" aria-label="Пауза" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg></button>
		<button id="openSettings" class="btn btn-circle btn-primary icon-m icon-settings"></button>
		<button id="hudExit" class="btn btn-circle btn-primary" title="Выйти в меню" aria-label="Выйти в меню"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 5H5v14h5M10 12h9M15.5 8.5L19 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
	</div>

	<div id="selectorContainer" class="hud-dock">
		<div id="hudAttackList" class="hud-attack-list" hidden></div>
		<div class="hud-action-row">
			<button id="hudBtnChat" class="hud-action is-locked" title="Чат" aria-label="Чат"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="hud-lock"></span></button>
			<button id="hudBtnAttacks" class="hud-action" title="Атаки" aria-label="Атаки" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 19L17 5M5 5l12 14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
			<button class="hud-action is-locked" title="Недоступно" aria-label="Недоступно"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4v8" stroke="currentColor" stroke-width="2"/></svg><span class="hud-lock"></span></button>
			<button class="hud-action is-locked" title="Недоступно" aria-label="Недоступно"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 12h18M7 8l5 4-5 4M17 8l-5 4 5 4" stroke="currentColor" stroke-width="2" fill="none"/></svg><span class="hud-lock"></span></button>
			<button class="hud-action is-locked" title="Недоступно" aria-label="Недоступно"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="hud-lock"></span></button>
		</div>
		<div class="hud-dock-row">
			<div class="hud-gold-pill" title="Золото (появится в этапе экономики)">
				<span class="hud-coin"></span><span id="hudGold">—</span>
			</div>
			<div class="hud-troop-bar">
				<span id="selectorTroopCount" class="hud-troops">0</span>
				<span id="hudTroopRate" class="hud-rate" title="Прирост войск в секунду">+0/s</span>
			</div>
			<div class="hud-attack-block">
				<div class="hud-attack-head"><span class="hud-attack-icon"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20L15 9M14 3l7 7-3 1-4 4-4-4 1-3z" fill="currentColor"/></svg></span><span id="sliderAttackNumber" class="hud-attack-percent">50.0%</span></div>
				<label id="sliderAttackStrength" class="hud-slider" title="Доля армии, которую вы отправляете">
					<input id="sliderAttackHidden" type="range" min="0" max="100" step="5">
				</label>
			</div>
		</div>
	</div>
</div>
