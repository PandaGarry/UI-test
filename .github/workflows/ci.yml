name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build-prod
      - name: Perf smoke (Europe, 30 bots)
        run: npx tsx scripts/perf-sim.ts --map Europe --bots 30 --ticks 600

  smoke:
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build-prod
      - name: Serve build
        run: |
          PORT=8080 node ../scripts/serve.js > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
      - name: Browser smoke (menu, lobby, countdown, start, FPS)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/smoke.mjs --url http://127.0.0.1:8080/ --bots 30 --fps-seconds 5
