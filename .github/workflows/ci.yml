name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Typecheck core package
        run: npm run typecheck:core
      - name: Lint
        run: npx eslint .
      - name: Lint core package
        run: npm run lint:core
      - name: Architecture boundaries (strict)
        run: node ../scripts/arch/check-boundaries.cjs --strict
      - name: Generate maps (needed by the determinism test)
        run: npm run gen-maps
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build-prod
      - name: Perf smoke (Europe, 30 bots)
        run: npx tsx scripts/perf-sim.ts --map Europe --bots 30 --ticks 600

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client dependencies and maps (server runner reads the map cache)
        run: |
          npm ci --prefix ../client
          npm run gen-maps --prefix ../client
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - name: Server dependencies
        run: bun install
      - name: Runner end-to-end test
        run: bun run test:runner

  smoke:
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build-prod
      - name: Serve build
        run: |
          PORT=8080 node ../scripts/serve.js > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
      - name: Browser smoke (menu, lobby, countdown, start, FPS)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/smoke.mjs --url http://127.0.0.1:8080/ --bots 30 --fps-seconds 5
